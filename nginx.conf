server {
    listen 80;
    server_name haimaienglish-user.localvibe.asia;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name haimaienglish-user.localvibe.asia;

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/localvibe.asia.pem;      # Path to the SSL certificate
    ssl_certificate_key /etc/ssl/private/localvibe.asia.key; # Path to the private key
    ssl_protocols TLSv1.2 TLSv1.3;                          # Enable only secure protocols
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';  # Secure ciphers
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Root directory (optional, serves static files like images)
    root /usr/share/nginx/html;

    # Main location block to forward requests to the Next.js app
    location / {
        proxy_pass http://app:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Optionally, handle static file requests directly from Nginx
    location /_next/static/ {
        alias /app/.next/static/;
    }

    # Optionally handle other assets (images, etc.)
    location /public/ {
        alias /app/public/;
    }
}
